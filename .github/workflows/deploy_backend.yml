# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ApiKeyVault-Api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build apikeyvault/apikeyvault.slnx --configuration Release -warnaserror

      - name: Test backend
        run: dotnet test apikeyvault/apikeyvault.slnx --configuration Release --no-build --no-restore

      - name: dotnet publish API
        run: dotnet publish apikeyvault/ApiKeyVault.Api/ApiKeyVault.Api.csproj --configuration Release --output artifacts/api

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: artifacts/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api
          path: artifacts/api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF3E7EAE71804C23BC49EFE51D094330 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A7865DC4AE524A108A67F6A45C189565 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3353AEACF9E046A98FD179E804489E62 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ApiKeyVault-Api'
          slot-name: 'Production'
          package: artifacts/api
          