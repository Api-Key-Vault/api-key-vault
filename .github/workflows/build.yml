name: build backend/frontend

on:
  pull_request:
    paths:
      - "apikeyvault/**"
      - "apikeyvault-frontend/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build apikeyvault/apikeyvault.slnx --configuration Release -warnaserror

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: apikeyvault-frontend
      - run: npm run lint
        working-directory: apikeyvault-frontend